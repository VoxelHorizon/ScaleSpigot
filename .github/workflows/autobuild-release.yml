name: Auto Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate version
        id: version
        run: |
          VERSION="auto-${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Replace plugin.yml version
        run: |
          TEMPLATE="src/main/resources/plugin.template.yml"
          OUTPUT="src/main/resources/plugin.yml"
          sed "s/@VERSION@/${{ steps.version.outputs.version }}/g" "$TEMPLATE" > "$OUTPUT"

      - name: Build with Maven
        run: mvn package

      - name: Find .jar file
        id: jar
        run: |
          JAR_PATH=$(find target -type f -name "*.jar" | head -n 1)
          echo "jar_file=$JAR_PATH" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          files: ${{ steps.jar.outputs.jar_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
